<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chef-to-Coder Recipe Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Chef-to-Coder Recipe Converter</h1>
    <p>Paste your traditional recipe below and get a simplified version, ready for coding minds or quick builds.</p>
    <textarea id="inputRecipe" placeholder="Paste your recipe here..."></textarea>
    <button id="convertBtn">Convert It</button>
    <h2>Converted Recipe:</h2>
    <pre id="outputRecipe"></pre>
  </div>
  <script src="script.js"></script>
</body>
</html>
