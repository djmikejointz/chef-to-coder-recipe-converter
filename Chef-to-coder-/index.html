<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Shooter Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrapper">
    <section class="hud" aria-live="polite">
      <h1>Arcade Shooter Prototype</h1>
      <p class="instructions">Move with WASD or the arrow keys. Press space to fire.</p>
      <div class="stats">
        <span>Score: <span id="score">0</span></span>
        <span>Lives: <span id="lives">3</span></span>
      </div>
    </section>
    <canvas
      id="gameCanvas"
      width="480"
      height="640"
      role="img"
      aria-label="Simple arcade shooter game where a pilot defends against drones"
    ></canvas>
  </main>

  <div class="overlay" id="gameOverOverlay" hidden>
    <div class="overlay-content">
      <h2>Game Over</h2>
      <p>You stopped <span id="finalScore">0</span> drones.</p>
      <button id="playAgainBtn" type="button">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
